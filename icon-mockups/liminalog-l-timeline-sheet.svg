<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Liminalog L timeline SVG icon concepts">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <clipPath id="mask"><rect width="256" height="256" rx="56"/></clipPath>
    <style>
      .label { font: 600 25px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #242832; }
      .note { font: 400 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #6B7280; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#F1F2F4"/>
  <text x="80" y="82" class="label">Liminalog L + timeline refinements</text>
  <text x="80" y="116" class="note">Clock arc removed. Timeline/status accents added to the L-hybrid direction.</text>

  <g transform="translate(102 210)">
    <text x="0" y="-24" class="label">Timeline dots</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <path d="M376 250 V644 Q376 742 474 742 H704" fill="none" stroke="#2F7DF6" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="464" y="302" width="170" height="46" rx="23" fill="#FFD15C"/>
        <rect x="464" y="430" width="120" height="46" rx="23" fill="#FF7A66"/>
        <rect x="464" y="558" width="184" height="46" rx="23" fill="#48C995"/>
        <rect x="704" y="278" width="22" height="396" rx="11" fill="#D6DAE0"/>
        <circle cx="715" cy="324" r="28" fill="#FFD15C"/>
        <circle cx="715" cy="476" r="28" fill="#FF7A66"/>
        <circle cx="715" cy="628" r="28" fill="#48C995"/>
      </g>
    </g>
  </g>

  <g transform="translate(462 210)">
    <text x="0" y="-24" class="label">Current status</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <path d="M374 250 V644 Q374 742 472 742 H704" fill="none" stroke="#2F7DF6" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="462" y="304" width="166" height="48" rx="24" fill="#FFD15C"/>
        <rect x="462" y="436" width="122" height="48" rx="24" fill="#FF7A66"/>
        <rect x="462" y="568" width="190" height="48" rx="24" fill="#48C995"/>
        <path d="M708 292 V662" stroke="#D6DAE0" stroke-width="22" stroke-linecap="round"/>
        <circle cx="708" cy="458" r="58" fill="#FFFFFF"/>
        <circle cx="708" cy="458" r="36" fill="#48C995"/>
        <circle cx="708" cy="458" r="14" fill="#FFFFFF" opacity="0.88"/>
      </g>
    </g>
  </g>

  <g transform="translate(822 210)">
    <text x="0" y="-24" class="label">Timeline flow</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <path d="M376 250 V644 Q376 742 474 742 H704" fill="none" stroke="#2F7DF6" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M474 322 H630" stroke="#FFD15C" stroke-width="48" stroke-linecap="round"/>
        <path d="M474 454 H586" stroke="#FF7A66" stroke-width="48" stroke-linecap="round"/>
        <path d="M474 586 H652" stroke="#48C995" stroke-width="48" stroke-linecap="round"/>
        <path d="M718 300 C672 364 672 426 718 490 C764 554 764 616 718 680" fill="none" stroke="#D6DAE0" stroke-width="28" stroke-linecap="round"/>
        <circle cx="718" cy="490" r="36" fill="#FFD15C"/>
      </g>
    </g>
  </g>
</svg>
