<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-label="Liminalog radical SVG icon concepts">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <clipPath id="mask"><rect width="256" height="256" rx="56"/></clipPath>
    <style>
      .label { font: 600 25px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #242832; }
      .note { font: 400 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #6B7280; }
    </style>
  </defs>
  <rect width="1400" height="980" fill="#F1F2F4"/>
  <text x="80" y="82" class="label">Liminalog radical SVG concepts</text>
  <text x="80" y="116" class="note">New motif families: beacon, pin, sunrise, bento, flag, podium.</text>

  <g transform="translate(82 176)">
