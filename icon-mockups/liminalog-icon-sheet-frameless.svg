<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Liminalog frameless SVG icon concepts">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <clipPath id="mask"><rect width="256" height="256" rx="56"/></clipPath>
    <style>
      .label { font: 600 25px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #242832; }
      .note { font: 400 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #6B7280; }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#F1F2F4"/>
  <text x="80" y="82" class="label">Liminalog frameless SVG concepts</text>
  <text x="80" y="116" class="note">No inner icon/card frame. These are symbol-first SVG bases for Icon Composer.</text>

  <g transform="translate(92 208)">
    <text x="0" y="-24" class="label">Rail</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <rect x="342" y="242" width="30" height="540" rx="15" fill="#D6DAE0"/>
        <rect x="428" y="250" width="268" height="112" rx="56" fill="#5E9CF5"/>
        <rect x="428" y="456" width="196" height="112" rx="56" fill="#FF7A66"/>
        <rect x="428" y="662" width="246" height="112" rx="56" fill="#48C995"/>
        <circle cx="357" cy="512" r="50" fill="#FFD15C"/>
        <circle cx="357" cy="512" r="20" fill="#FFFFFF" opacity="0.84"/>
      </g>
    </g>
  </g>

  <g transform="translate(404 208)">
    <text x="0" y="-24" class="label">Orbit</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <rect x="348" y="244" width="26" height="536" rx="13" fill="#D6DAE0"/>
        <rect x="430" y="252" width="260" height="108" rx="54" fill="#5E9CF5"/>
        <rect x="430" y="458" width="188" height="108" rx="54" fill="#FF7A66"/>
        <rect x="430" y="664" width="238" height="108" rx="54" fill="#48C995"/>
        <path d="M360 414 A98 98 0 1 1 360 610" fill="none" stroke="#FFD15C" stroke-width="36" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g transform="translate(716 208)">
    <text x="0" y="-24" class="label">Lanes</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <rect x="320" y="314" width="384" height="104" rx="52" fill="#5E9CF5"/>
        <rect x="320" y="460" width="272" height="104" rx="52" fill="#FF7A66"/>
        <rect x="320" y="606" width="336" height="104" rx="52" fill="#48C995"/>
        <rect x="320" y="314" width="82" height="104" rx="41" fill="#FFFFFF" opacity="0.34"/>
        <rect x="320" y="460" width="82" height="104" rx="41" fill="#FFFFFF" opacity="0.34"/>
        <rect x="320" y="606" width="82" height="104" rx="41" fill="#FFFFFF" opacity="0.34"/>
        <circle cx="704" cy="512" r="46" fill="#FFD15C"/>
        <circle cx="704" cy="512" r="18" fill="#FFFFFF" opacity="0.84"/>
      </g>
    </g>
  </g>

  <g transform="translate(1028 208)">
    <text x="0" y="-24" class="label">Stack</text>
    <g clip-path="url(#mask)" filter="url(#shadow)">
      <rect width="256" height="256" fill="#F7F4EE"/>
      <g transform="scale(.25)">
        <rect x="334" y="282" width="356" height="116" rx="58" fill="#5E9CF5"/>
        <rect x="334" y="454" width="256" height="116" rx="58" fill="#FF7A66"/>
        <rect x="334" y="626" width="322" height="116" rx="58" fill="#48C995"/>
        <circle cx="372" cy="340" r="20" fill="#FFFFFF" opacity="0.82"/>
        <circle cx="372" cy="512" r="20" fill="#FFFFFF" opacity="0.82"/>
        <circle cx="372" cy="684" r="20" fill="#FFFFFF" opacity="0.82"/>
        <path d="M706 296 L726 342 L772 362 L726 382 L706 428 L686 382 L640 362 L686 342 Z" fill="#FFD15C"/>
      </g>
    </g>
  </g>
</svg>
